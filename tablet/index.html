<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Panel</title>
<style>
  :root {
    --bg:      #17191d;
    --surface: #1f2228;
    --edge:    #2c3037;
    --ink:     #8b929e;
    --ink-dim: #575d68;
    --signal:  #7fb2e5;
    --lamp-on: #fff8ec;
    --thumb:   54px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 32px max(20px, env(safe-area-inset-bottom));
    gap: 20px;
    font-family: "Avenir Next Condensed", "Avenir Next", system-ui, sans-serif;
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
  }

  /* --- status bar --- */

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    flex: 0 0 auto;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ink-dim);
    transition: background .2s;
  }

  .status.live .dot { background: var(--signal); }
  .status.live     { color: var(--ink); }

  /* --- the lamp --- */

  .stage {
    flex: 1 1 auto;
    display: grid;
    place-items: center;
    min-height: 0;
  }

  .lamp {
    width:  min(30vh, 42vw);
    height: min(30vh, 42vw);
    border-radius: 50%;
    background: var(--edge);
    border: 3px solid #33383f;
    box-shadow: inset 0 3px 14px rgba(0,0,0,.6);
    transition: background 40ms linear, box-shadow 40ms linear;
  }

  .lamp.lit {
    background: var(--lamp-on);
    border-color: var(--lamp-on);
    box-shadow: 0 0 70px 6px rgba(255,248,236,.32);
  }

  /* --- rating scale --- */

  .control { flex: 0 0 auto; }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .label {
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .readout {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 30px;
    font-variant-numeric: tabular-nums;
    color: var(--signal);
  }

  .scale { position: relative; }

  /* faces above the track, numbers below; both pinned to thumb centres */

  .faces, .ticks { position: relative; }
  .faces { height: 58px; }
  .ticks { height: 26px; }

  .faces > *, .ticks > * {
    position: absolute;
    transform: translateX(-50%);
    transition: color .15s, opacity .15s;
  }

  .face {
    top: 0;
    width: 46px; height: 46px;
    color: var(--ink-dim);
    opacity: .5;
    cursor: pointer;
  }

  .face svg {
    width: 100%; height: 100%;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
  }

  .face svg .eye { fill: currentColor; stroke: none; }

  .face.on {
    color: var(--signal);
    opacity: 1;
    transform: translateX(-50%) scale(1.18);
  }

  .tick {
    top: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 15px;
    color: var(--ink-dim);
    cursor: pointer;
  }

  .tick.on { color: var(--signal); }

  .send {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 20px;
    border: none;
    border-radius: 12px;
    background: var(--signal);
    color: #10242f;
    font-family: inherit;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .15s, color .15s, opacity .15s;
  }

  .send:active { opacity: .75; }

  .send:focus-visible {
    outline: 3px solid var(--lamp-on);
    outline-offset: 3px;
  }

  .send.done, .send:disabled {
    background: var(--surface);
    color: var(--ink-dim);
    cursor: default;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: var(--thumb);
    background: transparent;
    margin: 0;
  }

  input[type=range]::-webkit-slider-runnable-track {
    height: 18px;
    border-radius: 9px;
    background:
      linear-gradient(var(--signal), var(--signal)) left / var(--fill, 0%) 100% no-repeat,
      var(--surface);
    border: 1px solid var(--edge);
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: var(--thumb); height: var(--thumb);
    margin-top: -19px;
    border-radius: 50%;
    background: #eef1f5;
    border: 1px solid #b9c0ca;
    box-shadow: 0 3px 10px rgba(0,0,0,.5);
  }

  input[type=range]:active::-webkit-slider-thumb { background: #fff; }

  input[type=range]::-moz-range-track {
    height: 18px; border-radius: 9px;
    background: var(--surface); border: 1px solid var(--edge);
  }
  input[type=range]::-moz-range-thumb {
    width: 52px; height: 52px; border-radius: 50%;
    background: #eef1f5; border: 1px solid #b9c0ca;
  }

  @media (prefers-reduced-motion: reduce) {
    .lamp, .faces > *, .ticks > * { transition: none; }
  }
</style>
</head>
<body>

  <div class="status" id="status">
    <span class="dot"></span><span id="statusText">Connecting</span>
  </div>

  <div class="stage">
    <div class="lamp" id="lamp"></div>
  </div>

  <div class="control">
    <div class="row">
      <span class="label">Rating</span>
      <span class="readout" id="readout">3</span>
    </div>
    <div class="scale">
      <div class="faces" id="faces"></div>
      <input type="range" id="slider" min="1" max="5" step="1" value="3">
      <div class="ticks" id="ticks"></div>
    </div>
    <button class="send" id="send" type="button">Send</button>
  </div>

<script>
(() => {
  const lamp    = document.getElementById('lamp');
  const slider  = document.getElementById('slider');
  const readout = document.getElementById('readout');
  const status  = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const sendBtn = document.getElementById('send');
  const facesRow = document.getElementById('faces');
  const ticksRow = document.getElementById('ticks');

  const WS_PORT = 8765;
  const STEPS = [1, 2, 3, 4, 5];
  let ws = null, blinkTimer = null, flashTimer = null;

  // ---- faces ---------------------------------------------------------------
  // Mouth curves only; everything else is shared. Swap these paths (or replace
  // faceSVG entirely with an <img>) to use your own artwork.

  const MOUTH = {
    1: 'M15 34 Q24 25 33 34',   // frown
    2: 'M15 33 Q24 28 33 33',
    3: 'M15 31 H33',            // flat
    4: 'M15 29 Q24 34 33 29',
    5: 'M15 28 Q24 37 33 28',   // smile
  };

  const faceSVG = v => `
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="21"></circle>
      <circle class="eye" cx="17" cy="19" r="2.4"></circle>
      <circle class="eye" cx="31" cy="19" r="2.4"></circle>
      <path d="${MOUTH[v]}"></path>
    </svg>`;

  // Thumb centre for step v, so faces and numbers line up with the handle.
  const pos = v => `calc(var(--thumb) / 2 + ${(v - 1) / 4} * (100% - var(--thumb)))`;

  const faceEls = {}, tickEls = {};

  for (const v of STEPS) {
    const f = document.createElement('div');
    f.className = 'face';
    f.style.left = pos(v);
    f.innerHTML = faceSVG(v);
    f.addEventListener('click', () => select(v));
    facesRow.appendChild(f);
    faceEls[v] = f;

    const t = document.createElement('div');
    t.className = 'tick';
    t.style.left = pos(v);
    t.textContent = v;
    t.addEventListener('click', () => select(v));
    ticksRow.appendChild(t);
    tickEls[v] = t;
  }

  function select(v) {
    slider.value = v;
    slider.dispatchEvent(new Event('input'));
  }

  // ---- lamp ----------------------------------------------------------------

  const setLamp = on => lamp.classList.toggle('lit', on);

  function stopTimers() {
    clearInterval(blinkTimer); blinkTimer = null;
    clearTimeout(flashTimer);  flashTimer = null;
  }

  function apply(msg) {
    if ('light' in msg) { stopTimers(); setLamp(!!msg.light); }

    if ('flash' in msg) {
      stopTimers();
      setLamp(true);
      flashTimer = setTimeout(() => setLamp(false), Number(msg.flash) || 200);
    }

    if ('blink' in msg) {
      stopTimers();
      const hz = Number(msg.blink) || 0;
      if (hz <= 0) { setLamp(false); return; }
      let on = false;
      blinkTimer = setInterval(() => setLamp(on = !on), 500 / hz);
    }

    if ('rating' in msg) select(Math.min(5, Math.max(1, Math.round(msg.rating))));
  }

  // ---- slider --------------------------------------------------------------

  let pending = null;

  slider.addEventListener('input', () => {
    const v = parseInt(slider.value, 10);
    slider.style.setProperty('--fill', ((v - 1) / 4 * 100) + '%');
    readout.textContent = v;
    for (const s of STEPS) {
      faceEls[s].classList.toggle('on', s === v);
      tickEls[s].classList.toggle('on', s === v);
    }
    if (pending === null) requestAnimationFrame(flush);
    pending = v;
    rearm();
  });

  function flush() {
    const v = pending;
    pending = null;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ slider: v }));
  }

  // ---- send ----------------------------------------------------------------

  let confirmTimer = null;

  function rearm() {
    clearTimeout(confirmTimer); confirmTimer = null;
    sendBtn.classList.remove('done');
    sendBtn.textContent = 'Send';
    sendBtn.disabled = !(ws && ws.readyState === WebSocket.OPEN);
  }

  sendBtn.addEventListener('click', () => {
    if (sendBtn.disabled) return;
    const v = parseInt(slider.value, 10);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ submit: v }));

    // Brief confirmation, and a lockout long enough to swallow a double-tap.
    sendBtn.classList.add('done');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sent';
    confirmTimer = setTimeout(rearm, 1200);
  });

  // ---- socket --------------------------------------------------------------

  function connect() {
    ws = new WebSocket(`ws://${location.hostname}:${WS_PORT}`);

    ws.onopen = () => {
      status.classList.add('live');
      statusText.textContent = 'Connected';
      pending = parseInt(slider.value, 10);
      flush();
      rearm();
    };

    ws.onmessage = e => {
      try { apply(JSON.parse(e.data)); } catch (_) {}
    };

    ws.onclose = () => {
      status.classList.remove('live');
      statusText.textContent = 'Reconnecting';
      stopTimers();
      setLamp(false);
      sendBtn.disabled = true;
      setTimeout(connect, 1000);
    };

    ws.onerror = () => ws.close();
  }

  slider.dispatchEvent(new Event('input'));   // paint initial state
  connect();

  // Safari drops the socket when the tab is backgrounded; reconnect on return.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && (!ws || ws.readyState === WebSocket.CLOSED)) connect();
  });

  // ---- keep the screen awake ----------------------------------------------

  let wakeLock = null;
  async function keepAwake() {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  if ('wakeLock' in navigator) {
    keepAwake();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) keepAwake();
    });
  }
})();
</script>
</body>
</html>
