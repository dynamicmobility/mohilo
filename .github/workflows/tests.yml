name: tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # the CPU wheel: pypolar runs on CPU in float64, and a runner has no GPU,
      # so the default CUDA build would be a multi-gigabyte download for nothing
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install pypolar
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v
