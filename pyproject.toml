[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypolar"
version = "0.1.0"
description = "Preference-based learning using POLAR (Preference Optimization and Learning Algorithm for Robotics)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pymoo",
    "botorch"
]

[project.scripts]
plr-print = "pypolar.experiment.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
    "pandas",
]
peripherals = [
    "sounddevice",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
